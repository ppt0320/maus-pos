<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MAU$ POS">
<link rel="manifest" href="manifest.webmanifest">
<title>MAU$ POS · Versión 1.8</title>
<style>
:root{--bg:#0e1218;--panel:#171d26;--panel2:#202936;--line:#2c3746;--txt:#f3f6fa;--muted:#9aa8b8;--green:#55d69a;--pink:#f04d9b;--gold:#e9bd62;--red:#ff6b75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;background:#10141bf2;backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 17px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px}
.brand span{color:var(--green)}
.sub{font-size:11px;color:var(--muted);letter-spacing:1.4px;margin-top:2px}
main{max-width:760px;margin:auto;padding:16px}
.page{display:none}
.page.active{display:block}
h2{font-size:21px;margin:7px 0 14px}
h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
.stat small,.muted{color:var(--muted)}
.stat strong{display:block;font-size:23px;margin-top:7px}
.green{color:var(--green)}
.pink{color:var(--pink)}
.gold{color:var(--gold)}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:#07130e;font-weight:750;font-size:14px;cursor:pointer}
button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button.danger{background:#48242b;color:#ffd9dc}
button.small{padding:8px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
input,select,textarea{width:100%;min-width:0;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0f151d;color:var(--txt);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none;touch-action:manipulation}
textarea{min-height:68px;resize:vertical}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}
.listitem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.listitem:last-child{border:0}
.itemtitle{font-weight:700}
.tiny{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;border-radius:99px;padding:4px 8px;background:#263a34;color:var(--green);white-space:nowrap}
.pill.credit{background:#3b2b3b;color:#ff9bd0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#111720f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(env(safe-area-inset-bottom) + 7px);backdrop-filter:blur(16px)}
nav button{background:none;color:var(--muted);padding:6px 3px;font-size:10px;flex:1;border-radius:9px}
nav button.active{color:var(--green);background:#1b302b}
nav .ico{font-size:19px;display:block;margin-bottom:3px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:19px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.sale-line{background:#101720;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.sale-line-grid{display:grid;grid-template-columns:1fr 85px;gap:8px}
.sale-line-grid .price{grid-column:1/2}
.sale-line-grid .qty{grid-column:2/3;grid-row:1/3}
.sale-line-grid label{margin-top:4px}
.qty-control{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:4px;align-items:center}
.qty-control button{padding:9px 2px;min-width:0}
.qty-control input{text-align:center;padding:10px 3px;min-width:0}
.total{font-size:25px;font-weight:850}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.reportrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.reportrow:last-child{border:0}
@media(min-width:650px){
nav{position:sticky;bottom:auto;max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:15px}
body{padding-bottom:20px}
header{position:relative}
}
.receipt-paper{background:#fff;color:#171717;border-radius:12px;padding:20px;max-width:440px;margin:0 auto;font:14px Arial,sans-serif}
.receipt-brand{text-align:center;font-size:27px;font-weight:900;letter-spacing:1px}
.receipt-sub{text-align:center;font-size:12px;font-weight:bold;margin:6px 0 14px;color:#444}
.receipt-paper hr{border:0;border-top:1px dashed #aaa;margin:14px 0}
.receipt-line{display:flex;justify-content:space-between;gap:10px;margin:12px 0}
.receipt-line small{display:block;color:#666;margin-top:4px}
.receipt-total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin:16px 0}
.receipt-thanks{text-align:center;font-weight:bold;margin-top:18px;color:#333}

/* Ajustes de lectura y pantalla móvil */
html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{width:100%;min-height:100dvh;overflow-x:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
main{width:100%;max-width:620px;min-width:0;padding:18px 16px 28px}
.page{width:100%;min-width:0}
input,select,textarea{font-size:16px!important}
.page h2{margin:10px 0 18px;line-height:1.25}
.card{padding:17px;margin-bottom:15px;border-radius:18px}
.sectionhead{margin:22px 3px 10px}
.sectionhead h3{margin:0}
.listitem{padding:15px 0;gap:12px;align-items:center}
.listitem>div:first-child{min-width:0;overflow-wrap:anywhere}
.actions{gap:9px;flex-wrap:wrap}
.actions button{flex:1 1 125px}
.report-card{padding:19px}
.report-card h3{margin-bottom:7px}
.report-paper{background:#fff;color:#171717;border-radius:12px;padding:18px;overflow-wrap:anywhere}
.report-paper h2,.report-paper h3{color:#171717}
.tablewrap{width:100%;overflow-x:auto}
.tablewrap table{width:100%;border-collapse:collapse;min-width:480px}
.tablewrap th,.tablewrap td{padding:9px 7px;border-bottom:1px solid #ddd;text-align:left;color:#171717;font-size:12px}
.modal{padding:10px;align-items:flex-end}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:22px 22px 12px 12px;padding:17px;margin:0 auto}
nav{padding-bottom:calc(7px + env(safe-area-inset-bottom));grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
nav button{min-width:0;padding:8px 2px;font-size:10px}
nav .ico{font-size:18px}

/* V1.8: ajuste real para iPhone y controles de cantidad */
html,body{max-width:100%;overflow-x:clip}
body{-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
main{max-width:100%;width:100%;padding-left:clamp(12px,4vw,18px);padding-right:clamp(12px,4vw,18px)}
.modal{left:0;right:0;width:100%;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.sheet{width:100%;max-width:620px;min-width:0;overflow-x:hidden}
.sale-line,.sale-line-grid,.sale-line-grid>div,.qty{min-width:0;max-width:100%}
.sale-line-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.sale-line-grid .price,.sale-line-grid .qty{grid-column:1;grid-row:auto}
.qty-control{display:grid;grid-template-columns:52px minmax(76px,1fr) 52px;gap:8px;align-items:stretch;width:100%;max-width:260px}
.qty-control button{width:52px;min-width:52px;min-height:48px;padding:8px;font-size:20px;line-height:1}
.qty-control input{width:100%;min-width:76px;min-height:48px;text-align:center;padding:8px 4px;font-size:18px!important;font-weight:700}
@media(min-width:520px){
.sale-line-grid{grid-template-columns:minmax(0,1fr) minmax(150px,190px);align-items:start}
.sale-line-grid .price{grid-column:1;grid-row:2}
.sale-line-grid .qty{grid-column:2;grid-row:1/3}
.qty-control{grid-template-columns:42px minmax(60px,1fr) 42px;max-width:190px}
.qty-control button{width:42px;min-width:42px}
}
</style>
</head>
<body>
<header>
<div>
<div class="brand">MAU$ <span>POS</span></div>
<div class="sub">VENTAS · PRODUCCIÓN · CLIENTES · VERSIÓN 1.8</div>
</div>
<button class="secondary small" onclick="backup()">Respaldo</button>
</header>
<main>
<section id="home" class="page active">
<h2>Resumen general</h2>
<div class="grid">
<div class="card stat"><small>Ventas de hoy</small><strong id="hSales">$0.00</strong></div>
<div class="card stat"><small>Por cobrar</small><strong id="hDebt" class="pink">$0.00</strong></div>
<div class="card stat"><small>Productos</small><strong id="hProducts">0</strong></div>
<div class="card stat"><small>Unidades disponibles</small><strong id="hStock">0</strong></div>
</div>
<div class="card">
<h3>Accesos rápidos</h3>
<div class="actions">
<button onclick="openSale()">＋ Nueva venta</button>
<button class="secondary" onclick="openProduction()">＋ Entrada de producción</button>
</div>
</div>
<div class="sectionhead"><h3>Últimos movimientos</h3></div>
<div class="card" id="recent"></div>
</section>
